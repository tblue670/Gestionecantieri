<style>

.vr .t{align-self:center;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.tot{grid-column:1/-1;background:var(--surf2);border-radius:8px;padding:10px 12px;display:grid;gap:3px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between}
.tot .g{font:700 22px var(--f-head)}
label.dg,fieldset.dg{display:flex;gap:8px;align-items:flex-start;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}fieldset.dg{flex-direction:column;gap:4px}fieldset.dg label{display:flex;gap:8px;align-items:center}#mg_info p{margin:4px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;max-width:90vw;font-weight:600}
#toast.bad{background:var(--neg);color:#fff}
.fday{display:flex;flex-direction:column;gap:6px}.fday>b{font-size:14px}.fday>b small{font-weight:500;color:var(--mut);margin-left:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.fth{position:relative;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surf2);aspect-ratio:1;cursor:pointer}
.fth img{width:100%;height:100%;object-fit:cover;display:block}
.fth i{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);color:#fff;font:normal 11px/1.2 var(--f-body);padding:3px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fstage{position:relative;grid-column:1/-1;display:flex;justify-content:center;background:#000;border-radius:8px;touch-action:pinch-zoom;user-select:none;-webkit-user-select:none;overscroll-behavior:contain}
.fbig{width:100%;max-height:58vh;object-fit:contain;border-radius:8px;-webkit-user-drag:none}
.fnav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:68px;border:0;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;font-size:34px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.fnav.l{left:6px}.fnav.r{right:6px}.fnav:disabled{opacity:.2;cursor:default}
.fcnt{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:2px 10px;border-radius:10px}
body:has(.fbig){overflow:hidden}
.ov:has(.fbig),.ov:has(.fbig) .md{overscroll-behavior:contain}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
@media(max-width:480px){.top h1{font-size:20px}.md{max-height:92vh}}
.ov{overscroll-behavior:contain}
.md{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#ai-log{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}#ai-chips{overscroll-behavior-x:contain}

  <div class="top">
    <h1>Contabilità <span>Cantieri</span></h1>
    <div class="tools"><span class="pill" id="bk" data-act="bkpill" role="button" hidden></span><span class="pill" id="sync">Connessione…</span><button class="ib" id="theme" type="button">Tema</button></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
'use strict';
/* ========== util ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtE=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
const fmtN=new Intl.NumberFormat('it-IT',{maximumFractionDigits:2});
const eur=n=>fmtE.format(n||0), nm=n=>fmtN.format(n||0);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fd=s=>s&&/^\d{4}-\d{2}-\d{2}$/.test(s)?s.split('-').reverse().join('/'):(s||'—');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sum=(a,f)=>a.reduce((s,x)=>s+(Number(f(x))||0),0);
const pn=s=>{if(s==null)return null;s=String(s).trim().replace(/\s/g,'').replace('€','');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)?n:null};
const cleanId=s=>String(s).replace(/[^A-Za-z0-9_\-]/g,'_').slice(0,120);
const cmpD=(a,b)=>(b.data||'').localeCompare(a.data||'')||(b.mod||0)-(a.mod||0);
const WD=['dom','lun','mar','mer','gio','ven','sab'];
const dayLabel=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return 'senza data';const d=new Date(s+'T12:00:00');return WD[d.getDay()]+' '+fd(s)};

/* ========== state ========== */
const COLS=['cantieri','personale','assegnazioni','presenze','pagamentiDipendenti','incassi','speseCantiere','speseDitta','preventivi'];
const S={cestino:[]}; COLS.forEach(c=>S[c]=[]);
const CFGDEF={costoOrario:0,iva:22,ditta:'',indirizzo:'',piva:''};
let CFG={...CFGDEF};
let db=null,canWrite=true,dbErr=null,loaded={};
const F={da:'',a:''};          // filtri
const V={tab:'quadro',det:null,sub:'cantiere'};
let FOTO=[],FV=null;
const CF={db:null,as:null,remote:null,busy:false,again:false,err:'',last:0,fromCache:true};
const FD={dir:null,perm:'none',last:0,err:'',busy:false,msg:''};
const DEFAULT_ORE=8;

/* ========== scrittura ========== */
const chain=new Map();
const enqueue=(key,fn)=>{const p=(chain.get(key)||Promise.resolve()).catch(()=>{}).then(fn);chain.set(key,p);return p};
async function retry(fn){try{return await fn()}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*600));return fn()}throw e}}
function needDb(){if(!db)throw new Error('Archivio non disponibile');if(!canWrite)throw new Error('Sola lettura: non hai i permessi di scrittura')}
let MODFLOOR=0;
const nextMod=()=>{MODFLOOR=Math.max(Date.now(),MODFLOOR+1);return MODFLOOR};
async function put(col,obj){
  needDb(); const o=JSON.parse(JSON.stringify(obj)); if(!o.id)o.id=uid(); if(!o.cr)o.cr=Date.now(); o.mod=nextMod();
  await enqueue(col+'/'+o.id,()=>retry(()=>db.collection(col).doc(o.id).set(o))); return o;
}
async function del(col,id){
  needDb(); const cur=S[col].find(x=>x.id===id); if(!cur)return;
  const tid=cleanId(col+'__'+id);
  await enqueue('cestino/'+tid,()=>retry(()=>db.collection('cestino').doc(tid).set({id:tid,col,rid:id,data:JSON.parse(JSON.stringify(cur)),del:Math.max(nextMod(),(cur.mod||0)+1)})));
  await enqueue(col+'/'+id,()=>retry(()=>db.collection(col).doc(id).delete()));
}
async function saveCfg(patch){
  needDb(); const n={...CFG,...patch,mod:Date.now()}; await enqueue('meta/config',()=>retry(()=>db.doc('meta/config').set(n))); CFG=n; sched();
}
function errMsg(e){return (e&&(e.message||e.code))||'errore sconosciuto'}

/* ========== calcoli ========== */
const inR=d=>{if(!F.da&&!F.a)return true;if(!d)return false;return(!F.da||d>=F.da)&&(!F.a||d<=F.a)};
const rg=a=>a.filter(x=>inR(x.data));
const cn=id=>{const c=S.cantieri.find(x=>x.id===id);return c?c.nome:(id?'(eliminato)':'—')};
const pnm=id=>{const p=S.personale.find(x=>x.id===id);return p?(p.nome+(p.cognome?' '+p.cognome:'')):(id?'(eliminato)':'—')};
function stCant(id,ranged){
  const ok=ranged?(x=>inR(x.data)):(()=>true);
  const ore=sum(S.presenze.filter(x=>x.cantiereId===id&&ok(x)),x=>x.ore);
  const inc=sum(S.incassi.filter(x=>x.cantiereId===id&&ok(x)),x=>x.importo);
  const mat=sum(S.speseCantiere.filter(x=>x.cantiereId===id&&ok(x)),x=>x.importo);
  const pag=sum(S.pagamentiDipendenti.filter(x=>x.cantiereId===id&&ok(x)),x=>x.importo);
  const est=CFG.costoOrario>0, man=est?ore*CFG.costoOrario:pag;
  const c=S.cantieri.find(x=>x.id===id)||{}, budget=Number(c.budget)||0;
  return{ore,inc,mat,pag,man,est,costi:mat+man,budget,res:budget-inc,mReal:inc-mat-man,mPrev:budget?budget-mat-man:null};
}
function stPers(id,ranged){
  const ok=ranged?(x=>inR(x.data)):(()=>true);
  const pr=S.presenze.filter(x=>x.personaId===id||x.personaleId===id).filter(ok);
  const pg=S.pagamentiDipendenti.filter(x=>x.personaleId===id&&ok(x));
  const t=k=>sum(pg.filter(x=>x.tipo===k),x=>x.importo);
  const perC={}; pr.forEach(x=>perC[x.cantiereId]=(perC[x.cantiereId]||0)+(Number(x.ore)||0));
  return{ore:sum(pr,x=>x.ore),acc:t('acconto'),sal:t('saldo'),rim:t('rimborso'),tot:sum(pg,x=>x.importo),perC,pr,pg};
}
function pvTot(p){const sub=sum(p.voci||[],v=>(+v.qta||0)*(+v.prezzo||0));const sc=sub*(+p.sconto||0)/100;const imp=sub-sc;const iva=imp*(+p.iva||0)/100;return{sub,sc,imp,iva,tot:imp+iva}}
function nextNum(){const y=new Date().getFullYear();let m=0;S.preventivi.forEach(p=>{const r=/^P-(\d{4})-(\d+)$/.exec(p.numero||'');if(r&&+r[1]===y)m=Math.max(m,+r[2])});return`P-${y}-${String(m+1).padStart(3,'0')}`}

/* ========== entità (form generici) ========== */
const cOpts=(cur,opt)=>()=>{const l=S.cantieri.filter(c=>c.stato!=='archiviato'||c.id===cur).sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>[c.id,c.nome]);return[[ '',opt?'— nessuno —':'Seleziona…'],...l]};
const pOpts=(cur)=>()=>[['','Seleziona…'],...S.personale.filter(p=>p.attivo!=='no'||p.id===cur).sort((a,b)=>pnm(a.id).localeCompare(pnm(b.id))).map(p=>[p.id,pnm(p.id)])];
const STATI=[['attivo','Attivo'],['sospeso','Sospeso'],['terminato','Terminato'],['archiviato','Archiviato']];
const CATD=['Carburante e mezzi','Assicurazioni','Attrezzatura','Tasse e contributi','Commercialista','Telefono e utenze','Personale (non di cantiere)','Altro'];
const links=(col,id)=>{
  const k=col==='cantieri'?'cantiereId':'personaId';const out=[];
  if(col==='cantieri'){[['assegnazioni','assegnazioni'],['presenze','presenze'],['pagamentiDipendenti','pagamenti personale'],['incassi','incassi'],['speseCantiere','spese'],['preventivi','preventivi']].forEach(([c,l])=>{const n=S[c].filter(x=>x.cantiereId===id).length;if(n)out.push(n+' '+l)})}
  else{const n1=S.presenze.filter(x=>x.personaId===id).length,n2=S.pagamentiDipendenti.filter(x=>x.personaleId===id).length,n3=S.assegnazioni.filter(x=>(x.personaleIds||[]).includes(id)).length;if(n1)out.push(n1+' presenze');if(n2)out.push(n2+' pagamenti');if(n3)out.push(n3+' assegnazioni')}
  return out;
};

const DUPL={presenze:'Ore',pagamentiDipendenti:'Pagamento al personale',incassi:'Incasso',speseCantiere:'Spesa'};
/* simula l'unione e trova le righe che diventerebbero doppie (solo gruppi che contengono almeno una riga spostata) */
function planMerge(col,id,t){
  const out=[];
  for(const c of Object.keys(DUPK)){
    const grp={};
    S[c].forEach(x=>{
      let y=x,moved=false;
      for(const[rc,f]of MERGE[col].refs){if(rc===c&&f!=='personaleIds'&&x[f]===id){y={...x,[f]:t};moved=true}}
      const kk=DUPK[c](y);(grp[kk]=grp[kk]||[]).push({x,moved,y});
    });
    for(const[k,rows]of Object.entries(grp)){
      if(rows.length<2||!rows.some(r=>r.moved))continue;
      rows.sort((a,b)=>(a.moved-b.moved)||((a.x.cr||0)-(b.x.cr||0))||a.x.id.localeCompare(b.x.id));
      const conflict=c==='presenze'&&new Set(rows.map(r=>Number(r.x.ore)||0)).size>1;
      out.push({c,rows,conflict});
    }
  }
  return out;
}

async function doMerge(){
  const{col,id}=MG,t=$('#mg_t').value,btn=$('#mg_go'),err=$('#merr');err.hidden=true;if(!t)return;btn.disabled=true;
  try{
    const src=S[col].find(x=>x.id===id),tgt=S[col].find(x=>x.id===t);if(!src||!tgt)throw new Error('Record non trovato');
    const srcName=col==='personale'?pnm(id):src.nome;
    const plan=planMerge(col,id,t);
    const dec=plan.map((g,n)=>{if(g.conflict){const r=document.querySelector(`[data-cg="${n}"]:checked`);if(!r)throw new Error('Scegli quale ora tenere per ogni voce con ore diverse');return r.value}
      const cb=document.querySelector(`[data-dg="${n}"]`);return cb&&cb.checked?'dedupe':'keepall'});
    for(const[c,f,x]of refsOf(col,id)){const o={...x};if(f==='personaleIds')o[f]=[...new Set(o[f].map(i=>i===id?t:i))];else o[f]=t;await put(c,o)}
    if(col==='cantieri')await fotoMove(id,t);

    for(let n=0;n<plan.length;n++){
      const g=plan[n],d=dec[n],ids=g.rows.map(r=>r.x.id);

      else if(d==='sum'){const cur=ids.map(i=>S.presenze.find(x=>x.id===i)).filter(Boolean);const notes=[...new Set(cur.map(x=>(x.note||'').trim()).filter(Boolean))];
        await put('presenze',{...cur[0],ore:cur.reduce((a,x)=>a+(Number(x.ore)||0),0),note:notes.join(' | ')});for(const rid of ids.slice(1)){await del('presenze',rid);removed++}}
      else{const keep=+d;for(let k=0;k<ids.length;k++){if(k!==keep){await del(g.c,ids[k]);removed++}}}
    }
    const patch={};['cliente','indirizzo','budget','dataInizio','dataFine','cognome','ruolo','telefono'].forEach(k=>{if((tgt[k]==null||tgt[k]==='')&&src[k]!=null&&src[k]!=='')patch[k]=src[k]});
    patch.alias=[...new Set([...(tgt.alias||[]),srcName,...(src.alias||[])].filter(Boolean))];
    if(src.note&&!(tgt.note||'').includes(src.note))patch.note=(tgt.note?tgt.note+'\n':'')+src.note;
    await put(col,{...tgt,...patch});await del(col,id);
    closeModal();MG=null;toast(`Unito «${srcName}» in «${labelOf(col,{...tgt,...patch})}»`+(removed?`; ${removed} doppioni eliminati (nel Cestino)`:''));
  }catch(e){err.textContent=errMsg(e);err.hidden=false;mergeReady()}
}

function scanDups(){
  const out=[];
  for(const c of Object.keys(DUPK)){
    const grp={};S[c].forEach(x=>{const k=DUPK[c](x);(grp[k]=grp[k]||[]).push({x})});
    for(const rows of Object.values(grp)){if(rows.length<2)continue;
      rows.sort((a,b)=>((a.x.cr||0)-(b.x.cr||0))||a.x.id.localeCompare(b.x.id));
      out.push({c,rows,conflict:c==='presenze'&&new Set(rows.map(r=>Number(r.x.ore)||0)).size>1})}
  }
  return out.sort((a,b)=>(a.rows[0].x.data||'').localeCompare(b.rows[0].x.data||''));
}

  try{
    for(let n=0;n<DUP.length;n++){
      const g=DUP[n],ids=g.rows.map(r=>r.x.id);
      if(!g.conflict){const cb=document.querySelector(`[data-dpg="${n}"]`);if(cb&&cb.checked){for(const rid of ids.slice(1)){await del(g.c,rid);removed++}}continue}
      const r=document.querySelector(`[data-dpc="${n}"]:checked`),v=r?r.value:'skip';
      if(v==='skip')continue;
      if(v==='sum'){const cur=ids.map(i=>S.presenze.find(x=>x.id===i)).filter(Boolean);const notes=[...new Set(cur.map(x=>(x.note||'').trim()).filter(Boolean))];await put('presenze',{...cur[0],ore:cur.reduce((a,x)=>a+(Number(x.ore)||0),0),note:notes.join(' | ')});for(const rid of ids.slice(1)){await del('presenze',rid);removed++}}
      else{for(let k=0;k<ids.length;k++)if(k!==+v){await del(g.c,ids[k]);removed++}}
    }
    closeModal();DUP=null;toast(removed?`${removed} righe doppie spostate nel Cestino`:'Nessuna modifica');
  }catch(e){err.textContent=errMsg(e);err.hidden=false;btn.disabled=false}
}

  (ppl.length?ppl.map(p=>`<div class="pr"><input type="checkbox" data-gp="${esc(p.id)}" id="gc_${esc(p.id)}"><span>${esc(pnm(p.id))}</span><input class="ore" inputmode="decimal" data-go="${esc(p.id)}" placeholder="ore"></div>`).join(''):'<p class="note f full">Aggiungi prima il personale.</p>');

      $('#m_data').onchange=sync;$('#m_cantiereId').onchange=sync;sync();

      form.addEventListener('input',e=>{const t=e.target;if(t.dataset.go&&t.value){const cb=form.querySelector(`[data-gp="${CSS.escape(t.dataset.go)}"]`);cb.checked=true;delete cb.dataset.auto}});

      for(const[p,ore]of rows){const ex=S.presenze.find(x=>x.data===v.data&&x.cantiereId===v.cantiereId&&x.personaId===p.id);
        if(ex){if(Number(ex.ore)!==ore){await put('presenze',{...ex,ore});u++}}else{await put('presenze',{data:v.data,cantiereId:v.cantiereId,personaId:p.id,ore});n++}}
      toast(`${n} nuove, ${u} aggiornate`);
    }});

async function doImport(){
  if(IMP.n.kind==='backup'&&MODE==='local'&&IMP.raw){try{const r=db._merge(IMP.raw);IMP=null;toast(`Aggiunti ${r.add}, aggiornati ${r.upd}, eliminati ${r.del}`);sched();if(window.fbSched)fbSched()}catch(e){toast(errMsg(e),1)}return}
  if(IMP.busy)return;
  const{P}=IMP.plan;const jobs=[];COLS.forEach(c=>P[c].add.forEach(x=>jobs.push([c,x])));
  let done=0,fail=0,lastErr='';IMP.busy=true;IMP.prog=`Importazione… 0/${jobs.length}`;sched();
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const putSafe=async(c,x)=>{for(let t=0;t<7;t++){try{return await put(c,x)}catch(e){const k=e&&e.code;if(k==='resource_exhausted'||k==='unavailable'){await sleep(700*Math.pow(1.7,t)+Math.random()*400);continue}throw e}}throw {code:'resource_exhausted',message:'troppe richieste: riprova tra un minuto'}};
  const imp=IMP;
  for(let k=0;k<jobs.length;k+=2){
    await Promise.all(jobs.slice(k,k+2).map(async([c,x])=>{try{await putSafe(c,x);done++}catch(e){fail++;lastErr=errMsg(e)}}));
    imp.prog=`Importazione… ${done+fail}/${jobs.length}`;const bx=$('#impProg');if(bx)bx.textContent=imp.prog;
    await sleep(60);
  }
  try{if(imp.n.cfg&&typeof imp.n.cfg==='object'&&!CFG.ditta&&!CFG.piva){const{mod:_m,...c}=imp.n.cfg;await saveCfg(c)}}catch{}
  imp.busy=false;imp.prog='';
  if(fail){imp.plan=plan(imp.n);toast(`Importati ${done}, non riusciti ${fail} (${lastErr}). Tocca di nuovo «Aggiungi» per completare`,true);}
  else{IMP=null;toast(`Importati ${done} record`)}
  sched();
}

async function fotoCloudSync(){
  if(!CF.db||!CF.remote)return;
  if(CF.busy){CF.again=true;return}
  CF.busy=true;CF.again=false;CF.err='';
  try{
    await FLOAD;
    // 1) eliminazioni fatte su questo dispositivo
    const dels=fDel(),keep=[];
    if(canWrite)for(const x of dels){if(!x||!x.id)continue;
      try{const aid=x.aid||(CF.remote.get(x.id)||{}).aid;
        if(aid&&!CF.as){keep.push(x);continue}
        await CF.db.doc('foto/'+x.id).delete();
        if(aid){try{await CF.as.delete(aid)}catch(e){if(e&&e.code==='rate_limited'){keep.push(x);continue}}}
        CF.remote.delete(x.id)}catch(e){keep.push(x);CF.err=cfMsg(e)}}
    else keep.push(...dels);
    if(keep.length!==dels.length)fDelSave(keep);
    const dset=new Set(keep.map(x=>x.id));
    // 2) dall'archivio condiviso a questo dispositivo
    const have=new Map(FOTO.map(x=>[x.id,x]));
    for(const [id,r] of CF.remote){if(dset.has(id))continue;const l=have.get(id);
      if(!l){const rec={id,cantiereId:r.cantiereId,data:r.data,nota:r.nota||'',t:r.t||0,m:r.m||r.t||0,thumb:r.thumb,aid:r.aid,url:r.url,cs:1};await fPutLocal(rec);FOTO.push(rec)}
      else if((r.m||0)>(l.m||0)){Object.assign(l,{cantiereId:r.cantiereId,data:r.data,nota:r.nota||'',m:r.m,aid:r.aid||l.aid,url:r.url||l.url,cs:1});await fPutLocal(l)}
      else if(!l.cs||(r.url&&l.url!==r.url)){l.cs=1;if(r.url){l.url=r.url;l.aid=r.aid}await fPutLocal(l)}}
    // 3) foto eliminate da un altro dispositivo
    if(!CF.fromCache)for(const l of FOTO.slice())if(l.cs&&!CF.remote.has(l.id)&&!dset.has(l.id)){
      await ftx(['f','b'],'readwrite',t=>{t.objectStore('f').delete(l.id);t.objectStore('b').delete(l.id)});FOTO=FOTO.filter(x=>x.id!==l.id)}
    // 4) da questo dispositivo all'archivio condiviso
    if(canWrite)for(const l of FOTO.slice()){if(dset.has(l.id))continue;const r=CF.remote.get(l.id);
      if(!r){
        if(!l.aid){if(!CF.as)continue;const blob=await fblob(l.id);if(!blob)continue;
          const a=await CF.as.upload(blob);l.aid=a.id;l.url=a.url;l.m=l.m||l.t;await fPutLocal(l)}
        const meta=fMetaC(l);await CF.db.doc('foto/'+l.id).set(meta);CF.remote.set(l.id,{...meta,id:l.id});l.cs=1;await fPutLocal(l)}
      else if((l.m||0)>(r.m||0)){const patch={cantiereId:l.cantiereId,cantiere:cn(l.cantiereId),data:l.data,nota:l.nota||'',m:l.m};
        await CF.db.doc('foto/'+l.id).update(patch);CF.remote.set(l.id,{...r,...patch})}}
    CF.last=Date.now();
  }catch(e){CF.err=cfMsg(e);console.warn('foto cloud',e)}
  CF.busy=false;sched();
  if(CF.again&&!CF.err)setTimeout(fotoCloudSync,200)
}

function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(Math.abs(m-n)>1)return 2;const d=[];for(let i=0;i<=m;i++){d[i]=[i];}for(let j=0;j<=n;j++)d[0][j]=j;

/* ---------- date, importi, ore ---------- */
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI=['domenica','lunedi','martedi','mercoledi','giovedi','venerdi','sabato'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function parseDate(n){
  const t=new Date();t.setHours(12,0,0,0);const out={date:null,words:[]};
  const add=(d,w)=>{out.date=iso(d);out.words.push(...w.split(' '));};
  let m;
  if(/\baltroieri\b|\baltro ieri\b|\bl altro ieri\b/.test(n)){const d=new Date(t);d.setDate(d.getDate()-2);add(d,'altroieri altro ieri');return out;}

  if((m=/\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/.exec(n))){
    let y=m[3]?+m[3]:t.getFullYear();if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1],12);
    if(!isNaN(d)&&+m[2]>=1&&+m[2]<=12){add(d,m[0]);return out;}}
  for(let i=0;i<12;i++){const r=new RegExp('\\b(\\d{1,2})\\s+'+MESI[i]+'(?:\\s+(\\d{4}))?\\b').exec(n);
    if(r){const d=new Date(r[2]?+r[2]:t.getFullYear(),i,+r[1],12);add(d,r[0]);return out;}}

    if(r){const d=new Date(t);let k=(d.getDay()-i+7)%7;if(k===0&&/scorso/.test(r[0]))k=7;d.setDate(d.getDate()-k);add(d,r[0]);return out;}}
  return out;
}
function parsePeriod(n){
  const t=new Date();t.setHours(12,0,0,0);const y=t.getFullYear(),mo=t.getMonth();
  const mk=(a,b,l)=>({da:iso(a),a:iso(b),label:l});
  { // intervalli espliciti: «17/07 e 24/07», «dal 17 al 24 luglio», «17 luglio 24 luglio»
    const ds=[];let m;const re=/\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/g;
    while((m=re.exec(n))){let yy=m[3]?+m[3]:y;if(yy<100)yy+=2000;if(+m[2]>=1&&+m[2]<=12)ds.push(new Date(yy,+m[2]-1,+m[1],12));}
    if(ds.length>=2){ds.sort((a,b)=>a-b);const a=ds[0],b=ds[ds.length-1];return mk(a,b,'dal '+fd(iso(a))+' al '+fd(iso(b)));}
    const ms=MESI.map((x,i)=>i).filter(i=>new RegExp('\\b'+MESI[i]+'\\b').test(n));
    const r2=new RegExp('\\b(\\d{1,2})\\s+(?:'+MESI.join('|')+')?\\s*(?:al|a|e|fino al|fino a|-)\\s*(?:il\\s+)?(\\d{1,2})\\s+('+MESI.join('|')+')\\b').exec(n);
    if(r2){const i=MESI.indexOf(r2[3]);const a=new Date(y,i,+r2[1],12),b=new Date(y,i,+r2[2],12);if(a<=b)return mk(a,b,'dal '+fd(iso(a))+' al '+fd(iso(b)));}
    const r3=new RegExp('\\b(\\d{1,2})\\s+('+MESI.join('|')+')\\b.*?\\b(\\d{1,2})\\s+('+MESI.join('|')+')\\b').exec(n);
    if(r3){const a=new Date(y,MESI.indexOf(r3[2]),+r3[1],12),b=new Date(y,MESI.indexOf(r3[4]),+r3[3],12);if(a<=b)return mk(a,b,'dal '+fd(iso(a))+' al '+fd(iso(b)));}
  }
  if(/\bquesto mese\b|\bnel mese\b/.test(n))return mk(new Date(y,mo,1,12),new Date(y,mo+1,0,12),'questo mese');
  if(/\bmese scorso\b/.test(n))return mk(new Date(y,mo-1,1,12),new Date(y,mo,0,12),'il mese scorso');

  for(let i=0;i<12;i++)if(new RegExp('\\b'+MESI[i]+'\\b').test(n)){const yy=i>mo?y-1:y;return mk(new Date(yy,i,1,12),new Date(yy,i+1,0,12),MESI[i]+' '+yy);}

}
function parseOre(n){
  let m=/(\d+(?:[.,]\d+)?)\s*(?:ore|ora|h)\b/.exec(n);if(m)return {v:parseFloat(m[1].replace(',','.')),w:m[0]};

function cands(col){

  }).filter(c=>c.toks.length);
}
function resolveMany(col,tokens){
  const C=cands(col),hit=new Map();
  tokens.forEach(t=>{if(STOPW.has(t)||t.length<2||isSyn(t))return;C.forEach(c=>{if(c.toks.some(ct=>eq(ct,t))){if(!hit.has(c.id))hit.set(c.id,{c:c,set:new Set()});hit.get(c.id).set.add(t);}});});
  const items=Array.from(hit.values()).map(x=>({c:x.c,set:x.set,cov:x.set.size/x.c.toks.length-(x.c.arch?0.01:0)}));
  items.sort((a,b)=>b.set.size-a.set.size||b.cov-a.cov);
  const used=new Set(),found=[],amb=[];
  items.forEach(it=>{
    const toks=Array.from(it.set);if(toks.every(t=>used.has(t)))return;
    const key=toks.sort().join('|');
    const rivals=items.filter(o=>Array.from(o.set).sort().join('|')===key);
    const top=Math.max.apply(null,rivals.map(r=>r.cov)),best=rivals.filter(r=>Math.abs(r.cov-top)<1e-9);
    const al=M.alias[col]||{};let pick=null;
    if(best.length===1)pick=best[0].c;
    else{const viaAlias=best.filter(b=>toks.some(t=>al[t]===b.c.id));if(viaAlias.length===1)pick=viaAlias[0].c;}
    toks.forEach(t=>used.add(t));
    if(pick){if(!found.some(f=>f.id===pick.id))found.push({id:pick.id,label:pick.label,toks:toks});}
    else amb.push({toks:toks,opts:best.map(b=>({id:b.c.id,label:b.c.label}))});
  });
  // alias esatti (anche su parole che non trovano nulla)
  const al=M.alias[col]||{};

  return {found:found,amb:amb,used:used};
}

const LAB={presenza:'Segnare presenze',spesa:'Registrare una spesa di cantiere',spesa_ditta:'Registrare una spesa di ditta',incasso:'Registrare un incasso',pagamento:'Pagare una persona',

function detect(n){
  if(/^(annulla|undo|torna indietro)\b/.test(n))return 'annulla';

  if(/\b(totale|totali|tutte|tutti|elenco|elenca|lista|riepilogo|somma|quante|quanti|mostra|mostrami|dammi|dimmi|vedi|fammi vedere)\b/.test(n)&&/\b(presenz\w*|ore)\b/.test(n)&&!/\b(segna|segnare|registra|registrare|inserisci|aggiungi|nuova|nuovo|crea)\b/.test(n)&&!/\d+(?:[.,]\d+)?\s*(?:ore|ora|h)\b/.test(n))return 'q_ore';
  if(/\b(presenz\w*)\b/.test(n)&&/\bcantiere\b/.test(n)&&!/\b(segna|segnare|registra|registrare|inserisci|aggiungi|nuova|nuovo|crea)\b/.test(n)&&!/\d/.test(n))return 'q_ore';
  if(/^(apri|vai|mostra|fammi vedere|portami)\b/.test(n))return 'apri';
  if(/\bcantiere\b/.test(n)&&/\b(modifica|modificare|cambia|cambiare|imposta|impostare|metti|segna|passa|porta|chiudi|chiudere)\b/.test(n)&&/\b(saldat\w*|chius\w*|chiud\w*|finit\w*|complet\w*|ultimat\w*|attiv\w*|sospes\w*|archiviat\w*|terminat\w*)\b/.test(n)||synHit('stato',n))return 'stato';

  if(/\?|^(quant|dimmi|totale|quali|mostra|vedi|qual)|\bquant[oi]\b/.test(n)&&/\b(pagat\w*|costat\w*|costano|costo|costi|paghe|paga|pagamenti|stipendi|manodopera|dato)\b/.test(n)&&(/\b(personale|dipendenti|operai|manodopera|paghe|stipendi)\b/.test(n)||hasP(n)))return 'q_paghe';
  if(/\b(in quali cantieri|quali cantieri|che cantieri|in che cantieri|in che cantiere|in quale cantiere|dove (ha|hanno|abbiamo|e stato|ha sempre)\b.*\blavorat\w*|dove lavorava|dove lavorano)\b/.test(n)&&!/\b(pagat\w*|paga|paghe|pagamenti|acconto|saldo)\b/.test(n)&&hasP(n))return 'q_lavoro';
  if(/\bquante ore\b|\bore (di|fatte|lavorate)\b|\bquanto ha lavorato\b/.test(n)&&/\?|^(quant|dimmi|ore|mostra|vedi|qual)/.test(n))return 'q_ore';
  if(/\bchi (e|sono)\b.*\b(assegnat\w*)\b|\bchi lavora\b|\bchi sta lavorando\b/.test(n))return 'q_assegnati';
  if(/^(quadro|panoramica|riepilogo generale|situazione generale|come stiamo)\b|\bquadro generale\b/.test(n))return 'q_quadro';
  if(/^(situazione|stato|riepilogo|come va|andamento)\b|\bmargine\b|\bquanto (ho|abbiamo)\b/.test(n)||(/^(quanto|qual e|qual|dimmi)\b/.test(n)&&(analyse(n).cant||analyse(n).ambC||/\b(ho|abbiamo|incass\w*|spes\w*|speso|cassa|saldo|guadagn\w*|costi|totale|cantieri|cantiere)\b/.test(n))))return 'q_cantiere';
  if(/\bincass\w*|\bpagato dal cliente\b|\bacconto dal cliente\b|\bsaldo dal cliente\b/.test(n))return 'incasso';
  if(/\b(pago|pagato|pagare|paga|pagamento|anticipo|do|ho dato|dato)\b/.test(n)&&(/\b(acconto|saldo|rimborso|paga|stipendio|anticipo|euro|eur)\b|€/.test(n)||(/\b(pagato|pagare|pagamento|ho dato)\b/.test(n)&&/\d/.test(n)&&analyse(n).pers.length>0)))return 'pagamento';
  if(/\b(acconto|saldo|rimborso|stipendio|anticipo)\b/.test(n)&&(/\d/.test(n))&&analyse(n).pers.length>0&&!analyse(n).cant)return 'pagamento';
  if(/\b(ho pagato|pagato|pagati|pagata)\b/.test(n)&&/\d/.test(n)&&!analyse(n).pers.length)return 'spesa';
  if(/\bspes\w*\b.*\bditta\b|\bditta\b.*\bspes\w*|\b(carburante|benzina|gasolio|assicurazione|commercialista|bolletta|telefono)\b/.test(n))return 'spesa_ditta';
  if(/\b(spesa|speso|spese|comprato|compra|acquisto|acquistato|fattura|materiale|materiali)\b/.test(n))return 'spesa';
  if(/\b(assegna|assegnare|assegnati|assegnato)\b/.test(n))return 'assegna';
  if(/\b(present\w*|presenza|lavorato|lavorano|lavora|segna|segnare|ore)\b/.test(n))return 'presenza';

const sig=n=>uniq(wordsOf(n).filter(t=>!/^\d+$/.test(t)&&!STOPW.has(t)&&t.length>2));
function learnedIntent(n){

  M.intents.forEach(it=>{const sb=new Set(it.sig);let c=0;s.forEach(x=>{if(sb.has(x))c++;});const d=2*c/(s.length+it.sig.length);if(d>=0.6&&(!best||d>best.d))best={i:it.intent,d};});

/* proposte pertinenti quando non capisce: solo le 3 più vicine alla frase, mai l'elenco completo */
const INTKW={presenza:'presente presenti presenza presenze segna ore lavorato giornata',spesa:'spesa speso comprato acquisto materiale fattura euro',spesa_ditta:'spesa ditta ufficio carburante furgone',

  q_date:'date giorni quando presenze',nuovo_preventivo:'preventivo offerta'};
function suggestIntents(n){
  const s=sig(n);if(!s.length)return [];
  const st=w=>w.slice(0,5);
  const dom=/\b(quant\w*|totale|mostra\w*|dimmi|sapere|vedere|vedi|elenc\w*|quando|dove|chi|quali|qual)\b/.test(n),act=/\b(segna\w*|registra\w*|crea\w*|aggiung\w*|assegna\w*|pag[ao]\w*|metti|inserisci)\b/.test(n);
  const sc=Object.keys(INTKW).filter(k=>dom&&!act?/^q_/.test(k):act&&!dom?!/^q_/.test(k):true).map(k=>{
    const kw=INTKW[k].split(' ').map(st);let c=0;

    M.intents.forEach(it=>{if(it.intent===k){const o=it.sig.filter(x=>s.includes(x)).length;if(o)c+=o*0.5;}});

function teachIntent(text,intent){

}

function analyse(text){

    const pick=rc.found.filter(f=>f.toks.some(t=>{const i=w.indexOf(t);return i>0&&(cue.has(w[i-1])||(i>1&&cue.has(w[i-2])));}));
    if(pick.length===1&&!rc.amb.length)cant=pick[0];

}

function needMore(plan){

  }
  if(['presenza','assegna'].includes(I)&&!(plan.persone&&plan.persone.length)){
    let opts=S.personale.filter(p=>p.attivo!=='no').map(p=>({id:p.id,label:pnm(p.id)})).sort((a,b)=>a.label.localeCompare(b.label));
    const as=S.assegnazioni.filter(x=>x.cantiereId===plan.cantiereId&&!x.al).flatMap(x=>x.personaleIds||[]);
    const btns=[];
    if(as.length&&I==='presenza')btns.push({l:'Tutti gli assegnati ('+uniq(as).length+')',cmd:'#all'});
    return {slot:'persone',q:b('Chi?',[...btns,...listBtns('personale',opts)])};
  }
  if(I==='pagamento'&&!(plan.persone&&plan.persone.length)){
    const opts=S.personale.filter(p=>p.attivo!=='no').map(p=>({id:p.id,label:pnm(p.id)})).sort((a,b)=>a.label.localeCompare(b.label));
    return {slot:'persone',q:b('A chi?',listBtns('personale',opts))};
  }
  if(['spesa','spesa_ditta','incasso','pagamento'].includes(I)&&!(plan.importo>0))return {slot:'importo',q:b('Che importo? (es. 120 euro)')};
  if(I==='presenza'&&plan.ore===undefined)plan.ore=null;
  return null;
}
async function finish(plan){
  const m=needMore(plan);
  if(m){P={plan:plan,slot:m.slot};M.stats.ask++;return [m.q];}
  P=null;const r=[await exec(plan)];
  return r.concat(await drainQ());

/* ---------- comandi multipli in una frase ---------- */
let Q=[],CURD=null;
async function drainQ(){
  const out=[];
  while(Q.length&&!P){const it=Q.shift();const r=await runIntent(it.intent,it.text,true,it.date);out.push(...r);}
  if(P&&Q.length)out.push(b('<small>Dopo questo eseguo anche: '+Q.map(x=>esc2(x.text)).join(' · ')+'</small>'));
  return out;
}
function segIntent(seg,prev,first){
  const n=norm(seg),it=detect(n);if(it)return it;
  const an=analyse(seg);
  if(an.pers.length&&an.cant){
    if(!first)return prev||'presenza';
    if(/(^|\s)\d{1,2}([.,]5)?(\s|$)/.test(n))return 'presenza';
  }
  return null;
}
function splitSegs(text){
  const parts=text.split(/\s*(?:,|;|\be\b|\bpoi\b|\binoltre\b|\banche\b)\s+|\s*[,;]\s*/i).map(x=>x.trim()).filter(Boolean);
  if(parts.length<2||parts.length>9)return null;
  const k=parts.length-1;let best=null;
  for(let mask=0;mask<(1<<k);mask++){
    const segs=[];let cur=parts[0];
    for(let i=0;i<k;i++){if(mask&(1<<i)){segs.push(cur);cur=parts[i+1];}else cur+=' e '+parts[i+1];}
    segs.push(cur);
    if(segs.length<2)continue;
    let prev=null,ok=true;const its=[];
    for(let i=0;i<segs.length;i++){const it=segIntent(segs[i],prev,i===0);if(!it||!['presenza','spesa','spesa_ditta','incasso','pagamento','assegna','stato'].includes(it)){ok=false;break;}its.push(it);prev=it;}
    if(ok&&(!best||segs.length>best.segs.length))best={segs:segs,its:its};
  }
  return best;
}

/* ---------- costruzione del piano da una frase ---------- */
const CAT=[[/carburante|benzina|gasolio|diesel|mezzi|furgone/,'Carburante e mezzi'],[/assicur/,'Assicurazioni'],[/attrezz|utensil|trapano/,'Attrezzatura'],[/tasse|inps|f24|contribut|inail/,'Tasse e contributi'],[/commercialista/,'Commercialista'],[/telefon|bolletta|utenz|luce|gas|internet/,'Telefono e utenze'],[/personale/,'Personale (non di cantiere)']];
function plan(text,intent,an){
  const n=an.n,P0={intent:intent,date:an.date.date,a:an};
  if(CURD&&!an.date.date)P0.date=CURD;
  const drop=new Set([...STOPW,...an.usedAll,...an.date.words]);
  if(an.cant)P0.cantiereId=an.cant.id;
  if(an.pers.length)P0.persone=an.pers.map(p=>({id:p.id,label:p.label}));
  if(an.amt)P0.importo=an.amt.v;
  if(an.ore&&an.ore.v!=null)P0.ore=an.ore.v;
  if(an.ore&&an.ore.v==null)P0.ore=DEFAULT_ORE;
  if(intent==='presenza'&&P0.ore===undefined&&!an.amt){
    const dw=new Set(an.date.words);const nums=wordsOf(n).filter(t=>/^\d{1,2}$/.test(t)&&!dw.has(t)&&+t>0&&+t<=16);
    if(nums.length===1)P0.ore=+nums[0];
  }
  if(/\btutti\b|\btutte\b/.test(n)&&P0.cantiereId){const as=uniq(S.assegnazioni.filter(x=>x.cantiereId===P0.cantiereId&&!x.al).flatMap(x=>x.personaleIds||[]));
    if(as.length)P0.persone=as.map(id=>({id:id,label:pnm(id)}));}
  if(intent==='spesa'||intent==='spesa_ditta'){
    const fm=/fornitore\s+([a-z0-9 ]+?)(?:\s+(?:per|a|in|oggi|ieri|euro)\b|$)/i.exec(text);
    if(fm){P0.fornitore=fm[1].trim().replace(/^./,c=>c.toUpperCase());}
    const dd=new Set(drop);['fornitore','materiale','materiali'].forEach(w=>dd.add(w));if(P0.fornitore)wordsOf(P0.fornitore).forEach(w=>dd.add(w));
    const ds=origWords(text.replace(/€\s*[\d.,]+|[\d.,]+\s*(?:€|euro|eur)\b/gi,' '),dd).trim();
    P0.descrizione=ds?ds.replace(/^./,c=>c.toUpperCase()):'';
    if(intent==='spesa_ditta'){P0.categoria='Altro';for(const [re,c] of CAT)if(re.test(n)){P0.categoria=c;break;}}
  }
  if(intent==='incasso')P0.tipo=(()=>{const s=synHit('tipo',n);return s&&s!=='rimborso'?s:(/\bsaldo\b/.test(n)?'saldo':'acconto');})();
  if(intent==='pagamento'){P0.tipo=synHit('tipo',n)||(/\bsaldo\b/.test(n)?'saldo':/\brimborso\b/.test(n)?'rimborso':'acconto');}
  if(intent==='stato'){P0.stato=synHit('stato',n)||(/archivi/.test(n)?'archiviato':/sospe/.test(n)?'sospeso':/termin|conclud|saldat|chius|chiud|finit|complet|ultimat/.test(n)?'terminato':'attivo');}
  return P0;
}

/* ---------- risposte di consultazione ---------- */
function statCant(c,per){
  const f=x=>!per||(x.data&&x.data>=per.da&&x.data<=per.a);
  const ore=sum(S.presenze.filter(x=>x.cantiereId===c.id&&f(x)),x=>x.ore),inc=sum(S.incassi.filter(x=>x.cantiereId===c.id&&f(x)),x=>x.importo);
  const mat=sum(S.speseCantiere.filter(x=>x.cantiereId===c.id&&f(x)),x=>x.importo),pag=sum(S.pagamentiDipendenti.filter(x=>x.cantiereId===c.id&&f(x)),x=>x.importo);
  const est=CFG.costoOrario>0,man=est?ore*CFG.costoOrario:pag,bud=Number(c.budget)||0;
  return {ore,inc,mat,man,est,costi:mat+man,bud,res:bud-inc,mar:inc-mat-man};
}
function answerCantiere(c,per,n){
  const s=statCant(c,per);

    'Incassi: '+eur(s.inc)];
  if(s.bud)lines.push('Budget: '+eur(s.bud)+' · ancora da incassare: '+eur(s.res));
  lines.push('Margine reale: '+eur(s.mar));

  if(/\bincass/.test(n))return b('Per '+esc2(c.nome)+(per?' ('+per.label+')':'')+' hai incassato <b>'+eur(s.inc)+'</b>'+(s.bud?' su un budget di '+eur(s.bud)+' (restano '+eur(s.res)+')':'')+'.');
  return tb(b(lines.join('<br>')),'Cantiere',['Voce','Valore'],[['Cantiere',c.nome],['Periodo',per?per.label:'Tutto'],['Ore lavorate',s.ore],['Materiali e spese €',s.mat],['Manodopera '+(s.est?'stimata':'pagata')+' €',s.man],['Incassi €',s.inc],['Budget €',s.bud||''],['Margine reale €',s.mar]]);
}
function answerLavoro(p,per,cid){
  const pr=S.presenze.filter(x=>x.personaId===p.id&&(!per||(x.data>=per.da&&x.data<=per.a))&&(!cid||x.cantiereId===cid)).sort((a,b)=>a.data<b.data?-1:1);
  if(!pr.length)return b('<b>'+esc2(p.label)+'</b>: nessuna presenza registrata'+(per?' · '+per.label:'')+(cid?' a '+esc2(cn(cid)):'')+'.');

/* ---------- calcolatrice ---------- */
let ANS=null;
function numIt(t){t=String(t);if(t.includes(','))return t.replace(/\./g,'').replace(',','.');if(/^\d{1,3}(\.\d{3})+$/.test(t))return t.replace(/\./g,'');return t;}
function calcEval(src){

  const v=add();if(i<tk.length)throw new Error('residuo');return v;
}
function calcParse(text){

  const cue=/\b(calcola\w*|quanto fa|quanto fanno|quanto viene|fai|fammi|risultato|conto|somma|sommami)\b/.test(t);
  // continuazione sul risultato precedente
  if(ANS!==null&&/^\s*(\+|-|\*|x|×|\/|:|per|più|piu|meno|diviso|fratto)\s*[\d(]/.test(t))t=' '+ANS+' '+t;
  t=t.replace(/\b(calcola\w*|quanto fa|quanto fanno|quanto viene|fai|fammi|risultato|il conto|conto|euro|eur|mi|per favore|somma|sommami|totale)\b/g,' ');
  const NUM='(\\d[\\d.,]*)';
  const P=x=>numIt(x);
  // iva
  let mm;
  t=t.replace(/scorpora\s+(?:l\s*)?iva\s+(?:da|di|su)\s+(\d[\d.,]*)/g,(m,a)=>' ('+P(a)+'/(1+'+(CFG.iva||22)+'/100)) ');
  t=t.replace(/iva\s*(?:al\s*)?(\d+)?\s*%?\s*(?:su|di|sul)\s+(\d[\d.,]*)/g,(m,a,b)=>' ('+P(b)+'*'+(a||CFG.iva||22)+'/100) ');
  t=t.replace(/(\d[\d.,]*)\s*(?:\+|più|piu|con)\s*iva\b/g,(m,a)=>' ('+P(a)+'*(1+'+(CFG.iva||22)+'/100)) ');
  // percentuali
  t=t.replace(/(\d[\d.,]*)\s*%\s*(?:di|del|dello|della|dell|sul|su)\s*(\d[\d.,]*)/g,(m,a,b)=>' ('+P(b)+'*'+P(a)+'/100) ');
  t=t.replace(/(\d[\d.,]*)\s*(\+|-|più|piu|meno)\s*(\d[\d.,]*)\s*%/g,(m,a,o,b)=>' ('+P(a)+'*(1'+(/^(\+|più|piu)$/.test(o)?'+':'-')+P(b)+'/100)) ');

  // parole -> operatori

  t=t.replace(/\d[\d.,]*/g,x=>/^\d+(\.\d+)?$/.test(x)&&!/\.\d{3}$/.test(x)?x:P(x));

  if(!/[+\-*\/^]/.test(clean)&&!/%/.test(String(text)))return null;

/* ---------- ingresso principale ---------- */
async function runCore(text){

      const ks=Object.keys(r.by);
      if(r.pg.cantiereId||ks.length!==1)continue;
      const old={...r.pg};await put('pagamentiDipendenti',{...r.pg,cantiereId:ks[0]});
      un.push(()=>put('pagamentiDipendenti',old));rowsT.push(fdate(r.pg.data)+' '+eur(r.pg.importo)+' → '+cn(ks[0]));

    {const html=(rowsT.length===1?'Assegnato 1 pagamento di ':'Assegnati '+rowsT.length+' pagamenti di ')+esc2(pnm(pid))+':<br>'+rowsT.map(esc2).join('<br>');UNDO.push({fns:un,label:html});M.stats.ok++;saveM();return [b('✓ '+html,[{l:'↩ Annulla',cmd:'annulla'}])];}
  }
  if(text==='#all'&&P){const pl=P.plan;const as=uniq(S.assegnazioni.filter(x=>x.cantiereId===pl.cantiereId&&!x.al).flatMap(x=>x.personaleIds||[]));
    pl.persone=as.map(id=>({id:id,label:pnm(id)}));return finish(pl);}
  if(text==='#intent:tutte'&&P&&P.unknown)return [b('Scegli cosa volevi fare:',Object.keys(LAB).filter(k=>!['apri','giornata'].includes(k)).map(k=>({l:LAB[k],cmd:'#intent:'+k})))];

    const u=UNDO.pop();if(!u)return [b('Non c\'è nulla da annullare.')];
    try{for(const f of u.fns)await f();}catch(e){return [b('Non sono riuscita ad annullare: '+esc2(e&&e.message||e))];}
    return [b('↩ Annullato: '+u.label)];
  }

  }

  Q=[];

  }

    t.rows.map(r=>'<tr>'+r.map(c=>'<td'+(typeof c==='number'?' style="text-align:right"':'')+'>'+esc3(fmtCell(c))+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
}
function download(name,mime,content){
  const bl=new Blob([content],{type:mime});
  const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
function fname(t,ext){return (t.name||'tabella').replace(/\s+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.'+ext;}
function saveExcel(t){
  const h='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>'+esc3(t.name||'Tabella')+'</x:Name></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>'+tableHtml(t)+'</body></html>';
  download(fname(t,'xls'),'application/vnd.ms-excel;charset=utf-8','﻿'+h);
}
function saveTxt(t){
  const rows=[t.head].concat(t.rows.map(r=>r.map(fmtCell)));
  const w=t.head.map((_,i)=>Math.min(40,Math.max(...rows.map(r=>String(r[i]==null?'':r[i]).length))));
  const line=r=>r.map((c,i)=>String(c==null?'':c).slice(0,40).padEnd(w[i])).join('  ').replace(/\s+$/,'');
  const out=[(t.name||'Tabella')+' - '+new Date().toLocaleDateString('it-IT'),'',line(rows[0]),w.map(x=>'-'.repeat(x)).join('  ')].concat(rows.slice(1).map(line));
  download(fname(t,'txt'),'text/plain;charset=utf-8','﻿'+out.join('\r\n'));
}
function savePdf(t){
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  const d=f.contentWindow.document;d.open();
  d.write('<html><head><meta charset="utf-8"><title>'+esc3(fname(t,'pdf').replace('.pdf',''))+'</title><style>body{font:12px Arial,sans-serif;margin:16px}h2{font-size:16px;margin:0 0 10px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #888;padding:4px 6px;text-align:left}th{background:#e8eef5}td[style]{text-align:right}@page{size:A4 landscape;margin:12mm}</style></head><body><h2>'+esc3(t.name||'Tabella')+' · '+new Date().toLocaleDateString('it-IT')+'</h2>'+tableHtml(t)+'</body></html>');
  d.close();
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print();}catch(e){}setTimeout(()=>f.remove(),60000);},300);
}
function bubble(cls,html,btns,tab,lid){
  const d=document.createElement('div');d.className='ai-m '+cls;d.innerHTML=html;
  if(btns&&btns.length){const w=document.createElement('div');w.className='ai-btns';
    btns.forEach(x=>{const k=document.createElement('button');k.type='button';k.textContent=x.l;k.onclick=()=>{w.querySelectorAll('button').forEach(z=>z.disabled=true);send(x.cmd,x.l);};w.appendChild(k);});d.appendChild(w);}
  if(tab&&tab.rows&&tab.rows.length){const w=document.createElement('div');w.className='ai-btns';const lb=document.createElement('span');lb.textContent='⬇ Esporta come:';lb.style.cssText='font-size:13px;align-self:center';w.appendChild(lb);[['Excel',saveExcel],['PDF',savePdf],['Testo',saveTxt]].forEach(([l,fn])=>{const k=document.createElement('button');k.type='button';k.textContent=l;k.onclick=()=>fn(tab);w.appendChild(k);});d.appendChild(w);}
  if(lid){const w=document.createElement('div');w.className='ai-fb';
    [['👍',1,'Giusto: ricordalo'],['👎',-1,'Non era giusto']].forEach(([ic,v,tt])=>{const k=document.createElement('button');k.type='button';k.textContent=ic;k.title=tt;k.onclick=()=>{w.remove();send('#fb:'+v+':'+lid,v>0?'👍 Giusto':'👎 Non era giusto');};w.appendChild(k);});d.appendChild(w);}
  log.appendChild(d);log.scrollTop=log.scrollHeight;return d;
}
let busy=false;
async function send(cmd,shown){
  if(busy)return;const t=(cmd||'').trim();if(!t)return;
  bubble('ai-u',esc(shown||t));busy=true;
  try{const res=await window.CCAI.run(t);res.forEach(r=>bubble('ai-b',r.t,r.btns,r.tab,r.lid));}
  catch(e){bubble('ai-b','Errore: '+esc(e&&e.message||e)+'<br><small>Nessun dato è stato perso: puoi riprovare o fare la stessa cosa a mano.</small>');console.error(e);}
  busy=false;
}
$$('#ai-form').addEventListener('submit',e=>{e.preventDefault();try{window.CCAI_micStop&&window.CCAI_micStop();}catch(x){}const v=inp.value;inp.value='';send(v);});
$$('#ai-fab').onclick=()=>{panel.classList.add('on');$$('#ai-fab').style.display='none';inp.focus();if(!log.children.length)welcome();};
$$('#ai-x').onclick=()=>{panel.classList.remove('on');$$('#ai-fab').style.display='';};
/* con una finestra aperta (Salva, Annulla…) il pulsante e il pannello dell'assistente si nascondono: non coprono più nulla */
(function(){const mo=document.getElementById('modal');if(!mo)return;
  const chk=()=>{const open=!!mo.querySelector('.ov');document.body.classList.toggle('ai-hide',open);
    if(open&&panel.classList.contains('on')){panel.classList.remove('on');$$('#ai-fab').style.display='';}};
  new MutationObserver(chk).observe(mo,{childList:true,subtree:true});chk();})();
function welcome(){
  const old=(window.CCAI.LOG?window.CCAI.LOG():[]).slice(-12);
  if(old.length){const sp=document.createElement('div');sp.className='ai-sep';sp.textContent='— conversazioni precedenti —';log.appendChild(sp);
    old.forEach(e=>{if(e.u)bubble('ai-u ai-old',esc(e.u));if(e.a)bubble('ai-b ai-old',esc(e.a.length>220?e.a.slice(0,220)+'…':e.a));});
    const s2=document.createElement('div');s2.className='ai-sep';s2.textContent='— oggi —';log.appendChild(s2);}
  bubble('ai-b','Ciao. Dimmi cosa devo fare, anche a voce 🎤. Ad esempio:<br><small>«Angelo e Aziz presenti oggi 8 ore a Via Garibaldi»<br>«spesa 120 euro cemento per Rossi»<br>«quanto ho speso a Bianchi?»</small><br>Ogni operazione si può annullare. Se non capisco, ti chiedo e imparo.');
}
const fq=(window.CCAI.frequent?window.CCAI.frequent(3):[]).map(x=>[x.text.length>26?x.text.slice(0,25)+'…':x.text,x.text]);
const chips=[...fq,['Presenze di oggi','presenti oggi '],['Registra spesa','spesa  euro per '],['Registra incasso','incassato  euro da '],['Quadro generale','quadro generale'],['Aiuto','aiuto']];
chips.forEach(([l,t])=>{const k=document.createElement('button');k.type='button';k.textContent=l;
  k.onclick=()=>{if(/\s$/.test(t)||/ {2}/.test(t)){inp.value=t.replace('  ',' ');inp.focus();}else send(t,l);};$$('#ai-chips').appendChild(k);});
/* microfono */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const mic=$$('#ai-mic');
if(!SR)mic.style.display='none';
else{let rec=null,base='';
  /* motore vocale di Google: la dettatura finisce da sola quando smetti di parlare */
  const stop=()=>{mic.classList.remove('rec');try{rec&&rec.abort();}catch(e){}rec=null;};
  window.CCAI_micStop=stop;
  mic.onclick=()=>{
    if(rec){stop();inp.focus();return;}
    base=inp.value.trim();
    try{
      const r=new SR();rec=r;r.lang='it-IT';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
      r.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+' ';if(rec===r)inp.value=(base+' '+s).trim();};
      r.onend=()=>{if(rec===r){rec=null;mic.classList.remove('rec');inp.focus();}};
      r.onerror=()=>{if(rec===r){rec=null;mic.classList.remove('rec');}};
      r.start();mic.classList.add('rec');
    }catch(e){rec=null;mic.classList.remove('rec');}
  };}
/* memoria dell'assistente */
$$('#ai-mem').onclick=()=>{
  const M=window.CCAI.M(),na=Object.keys(M.alias.cantieri).length+Object.keys(M.alias.personale).length;
  const d=bubble('ai-b','<b>Memoria dell\'assistente</b><br><small>'+na+' nomi imparati · '+M.intents.length+' frasi imparate · '+M.stats.ok+' operazioni eseguite<br>Non fa parte del backup dei dati: usa i pulsanti qui sotto per salvarla.</small>',[
    {l:'📖 Vocabolario',cmd:'#voc'},{l:'📜 Cronologia',cmd:'#log'},{l:'⬇ Salva memoria',cmd:'#mem:save'},{l:'⬆ Carica memoria',cmd:'#mem:load'},{l:'Azzera memoria',cmd:'#mem:reset'}]);
};
/* vocabolario: l'utente insegna parole equivalenti dall'app */
function vocOpen(){
  const M=window.CCAI.M(),list=[];
  ['stato','tipo'].forEach(c=>Object.keys(M.syn[c]||{}).forEach(w=>list.push([c,w,M.syn[c][w]])));
  modalShell('Vocabolario assistente',`<p class="note">Insegna all'assistente che una parola o frase vale come un'altra. Esempio: «finito» significa stato Terminato.</p>
  <div class="list">${list.length?list.map(([c,w,v])=>`<div class="row" style="cursor:default"><div class="m"><b>${esc(w)}</b><small>${c==='stato'?'stato del cantiere':'tipo di pagamento/incasso'} → ${esc(v)}</small></div><div class="v"><button type="button" class="btn sm" data-act="vocdel" data-c="${c}" data-w="${esc(w)}">Elimina</button></div></div>`).join(''):'<div class="empty">Nessuna parola insegnata.</div>'}</div>
  <label class="f full"><span>Parola o frase</span><input id="voc_w" autocomplete="off" placeholder="es. finito"></label>
  <label class="f full"><span>Significa</span><select id="voc_v"><optgroup label="Stato del cantiere"><option value="stato:attivo">Attivo</option><option value="stato:sospeso">Sospeso</option><option value="stato:terminato">Terminato</option><option value="stato:archiviato">Archiviato</option></optgroup><optgroup label="Tipo di pagamento / incasso"><option value="tipo:acconto">Acconto</option><option value="tipo:saldo">Saldo</option><option value="tipo:rimborso">Rimborso (solo pagamenti)</option></optgroup></select></label>
  <div class="acts"><button type="button" class="btn" data-act="mclose">Chiudi</button><button type="button" class="btn pri" data-act="vocadd">Aggiungi</button></div>`);
}
ACTS.vocadd=()=>{const M=window.CCAI.M(),w=window.CCAI.norm(document.getElementById('voc_w').value),v=document.getElementById('voc_v').value.split(':');
  if(!w){toast('Scrivi la parola',1);return;}
  M.syn[v[0]][w]=v[1];window.CCAI.save();toast('Imparato: «'+w+'» = '+v[1]);vocOpen();};
ACTS.vocdel=el=>{const M=window.CCAI.M();delete M.syn[el.dataset.c][el.dataset.w];window.CCAI.save();vocOpen();};
const run0=window.CCAI.run;
window.CCAI.run=async function(t){
  if(t==='#voc'){vocOpen();return [{t:'Ho aperto il vocabolario.',btns:[]}];}
  if(t==='#mem:save'){const blob=new Blob([JSON.stringify(Object.assign({},window.CCAI.M(),{log:window.CCAI.LOG()}))],{type:'application/json'});dlSave('memoria-assistente-'+today()+'.json',blob);return [{t:'Memoria pronta per il salvataggio.',btns:[]}];}
  if(t==='#mem:load'){const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result),M=window.CCAI.M();
      ['cantieri','personale'].forEach(c=>Object.assign(M.alias[c],(o.alias||{})[c]||{}));['stato','tipo'].forEach(c=>Object.assign(M.syn[c],(o.syn||{})[c]||{}));(o.log||[]).forEach(e=>{const L=window.CCAI.LOG();if(!L.some(x=>x.t===e.t&&x.u===e.u))L.push(e);});(o.intents||[]).forEach(i=>{if(!M.intents.some(x=>x.intent===i.intent&&x.sig.join(' ')===i.sig.join(' ')))M.intents.push(i);});
      localStorage.setItem('cc_ai_v1',JSON.stringify(M));bubble('ai-b','Memoria caricata e unita.');}catch(e){bubble('ai-b','File non valido.');}};r.readAsText(f.files[0]);};f.click();return [{t:'Scegli il file della memoria…',btns:[]}];}
  if(t==='#mem:reset'){const M=window.CCAI.M();M.alias={cantieri:{},personale:{}};M.syn={stato:{},tipo:{}};M.intents.length=0;localStorage.setItem('cc_ai_v1',JSON.stringify(M));return [{t:'Memoria dell\'assistente azzerata. I dati dell\'app non sono toccati.',btns:[]}];}
  return run0(t);
};
})();
