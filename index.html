<style>
:root{--bg:#f3f0e8;--surf:#fffdf8;--ink:#1d2125;--mut:#666b6f;--line:#d8d2c3;--acc:#c44d17;--acc-ink:#fff;--neg:#b0301d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141618;--surf:#1d2023;--ink:#ece8df;--mut:#98a0a5;--line:#33383c;--acc:#ef7a42;--acc-ink:#1a1208;--neg:#ef7c6a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
main{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
h1{margin:0;font:700 30px/1.1 'Arial Narrow',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.03em}h1 span{color:var(--acc)}
p{margin:0;color:var(--mut)}
label.t{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
input[type=password]{font:inherit;font-size:16px;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:12px}
input[type=password]:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
label.c{display:flex;gap:8px;align-items:center;font-size:15px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 16px;background:var(--acc);color:var(--acc-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#e{min-height:1.3em;color:var(--neg)}
</style></head><body>
